<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOES OF ETERNITY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 100%);
        }

        /* Splash Screen Container */
        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #2a1f3a 0%, #0a0f1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 1s ease 9s forwards;
        }

        /* Sacred Background Pattern */
        .sacred-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255, 107, 53, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 40% 60%, rgba(255, 105, 180, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 70% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 35%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        /* Main Content Container */
        .content-container {
            position: relative;
            width: 1000px;
            height: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        /* Sacred Light Rays */
        .light-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent 70%);
            border-radius: 50%;
            animation: raysPulse 4s ease-in-out infinite;
            z-index: 5;
        }

        .static-ray {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), rgba(255, 105, 180, 0.2), rgba(255, 215, 0, 0.2), transparent);
            transform-origin: left center;
            opacity: 0.5;
        }

        .ray1 { transform: rotate(0deg) translateY(-50%); }
        .ray2 { transform: rotate(30deg) translateY(-50%); }
        .ray3 { transform: rotate(60deg) translateY(-50%); }
        .ray4 { transform: rotate(90deg) translateY(-50%); }
        .ray5 { transform: rotate(120deg) translateY(-50%); }
        .ray6 { transform: rotate(150deg) translateY(-50%); }
        .ray7 { transform: rotate(180deg) translateY(-50%); }
        .ray8 { transform: rotate(210deg) translateY(-50%); }
        .ray9 { transform: rotate(240deg) translateY(-50%); }
        .ray10 { transform: rotate(270deg) translateY(-50%); }
        .ray11 { transform: rotate(300deg) translateY(-50%); }
        .ray12 { transform: rotate(330deg) translateY(-50%); }

        @keyframes raysPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.7;
            }
        }

        /* Sacred Circles */
        .sacred-circles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sacred-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid;
            animation: circlePulse 4s ease-in-out infinite;
        }

        .circle1 {
            width: 200px;
            height: 200px;
            border-color: rgba(255, 215, 0, 0.6);
            animation-delay: 0s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .circle2 {
            width: 300px;
            height: 300px;
            border-color: rgba(255, 107, 53, 0.5);
            animation-delay: 0.2s;
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.2);
        }

        .circle3 {
            width: 400px;
            height: 400px;
            border-color: rgba(255, 105, 180, 0.4);
            animation-delay: 0.4s;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
        }

        .circle4 {
            width: 500px;
            height: 500px;
            border-color: rgba(255, 215, 0, 0.3);
            animation-delay: 0.6s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .circle5 {
            width: 600px;
            height: 600px;
            border-color: rgba(138, 43, 226, 0.3);
            animation-delay: 0.8s;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.1);
        }

        .circle6 {
            width: 700px;
            height: 700px;
            border-color: rgba(255, 215, 0, 0.2);
            animation-delay: 1s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        @keyframes circlePulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.4;
                border-width: 2px;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 0.8;
                border-width: 3px;
            }
        }

        /* ===== CUSTOM SACRED SYMBOL ===== */
        .symbol-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            margin-bottom: 30px;
            animation: floatSymbol 5s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes floatSymbol {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Sacred Sanskrit Text */
        .sacred-text {
            font-size: 2.2rem;
            color: #ffd700;
            letter-spacing: 8px;
            font-family: 'Arial Unicode MS', serif;
            animation: textFade 2s ease-out forwards;
            opacity: 0;
            white-space: nowrap;
            text-shadow: 0 0 30px #ffd700, 0 0 60px #ff69b4;
            margin-bottom: 20px;
            font-weight: 500;
        }

        @keyframes textFade {
            0% { opacity: 0; transform: translateY(-40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Custom Sacred Symbol - Combining elements that match "ECHOES OF ETERNITY" */
        .custom-symbol {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0);
            animation: symbolAppear 2s ease-out forwards, symbolPulse 3s ease-in-out infinite 2.5s;
        }

        @keyframes symbolAppear {
            0% { 
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.2);
            }
            100% { 
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes symbolPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 40px #ff69b4);
            }
            50% { 
                filter: drop-shadow(0 0 40px #ffd700) drop-shadow(0 0 80px #ff1493) drop-shadow(0 0 120px #8a2be2);
            }
        }

        /* Eternal Circle - Represents Eternity */
        .eternal-circle {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 4px solid #ffd700;
            border-radius: 50%;
            border-top-color: #ff69b4;
            border-right-color: #ff8c00;
            border-bottom-color: #ff1493;
            border-left-color: #8a2be2;
            animation: rotate 8s linear infinite;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        /* Inner Circle */
        .inner-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: rotateReverse 6s linear infinite;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Center Dot - Represents the Source */
        .center-dot {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ffffff, #ffd700);
            border-radius: 50%;
            box-shadow: 0 0 40px #ffd700;
            animation: dotGlow 2s ease-in-out infinite;
        }

        @keyframes dotGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        /* Sound Waves - Represents "Echoes" */
        .wave {
            position: absolute;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: waveExpand 3s ease-out infinite;
        }

        .wave1 {
            width: 200px;
            height: 200px;
            animation-delay: 0s;
        }

        .wave2 {
            width: 220px;
            height: 220px;
            animation-delay: 0.5s;
            opacity: 0.3;
        }

        .wave3 {
            width: 240px;
            height: 240px;
            animation-delay: 1s;
            opacity: 0.2;
        }

        @keyframes waveExpand {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* Infinity Symbol - Represents "Eternity" */
        .infinity-symbol {
            position: absolute;
            font-size: 4rem;
            color: rgba(255, 215, 0, 0.2);
            transform: rotate(90deg);
            animation: infinityGlow 4s ease-in-out infinite;
        }

        @keyframes infinityGlow {
            0%, 100% { opacity: 0.2; text-shadow: 0 0 20px #ffd700; }
            50% { opacity: 0.6; text-shadow: 0 0 40px #ffd700, 0 0 80px #ff69b4; }
        }

        /* Mountain Peak - Represents Sacred Places */
        .mountain-symbol {
            position: absolute;
            top: -20px;
            font-size: 2rem;
            color: rgba(255, 215, 0, 0.3);
            animation: floatMountain 4s ease-in-out infinite;
        }

        @keyframes floatMountain {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Temple Symbol */
        .temple-symbol {
            position: absolute;
            bottom: -20px;
            font-size: 2rem;
            color: rgba(255, 215, 0, 0.3);
            animation: floatTemple 4s ease-in-out infinite;
            animation-delay: 1s;
        }

        @keyframes floatTemple {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* ===== TITLE SECTION ===== */
        .title-section {
            text-align: center;
            z-index: 50;
            margin: 20px 0 15px;
            opacity: 0;
            animation: titleAppear 2s ease-out forwards;
            animation-delay: 2.2s;
        }

        @keyframes titleAppear {
            0% { 
                opacity: 0;
                transform: scale(0.6) translateY(30px);
                filter: blur(15px);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05) translateY(-5px);
                filter: blur(3px);
            }
            100% { 
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .main-title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(45deg, #ffffff, #ffd700, #ff8c00, #ff69b4, #ffd700, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 300% 300%;
            animation: gradientMove 4s ease infinite;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            font-family: 'Times New Roman', serif;
            margin-bottom: 10px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 50%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sub-title {
            font-size: 2.4rem;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 5px;
            font-weight: 300;
            text-shadow: 0 0 40px #ffd700, 0 0 80px #ff69b4;
            margin-top: 5px;
        }

        .sub-title::before,
        .sub-title::after {
            content: '✦';
            margin: 0 20px;
            color: #ffd700;
            font-size: 2rem;
            animation: sparkle 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.6; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(10deg); }
        }

        /* Tagline */
        .tagline {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
            text-shadow: 0 0 30px #ffd700;
            animation: taglineFade 1.5s ease forwards;
            animation-delay: 3.5s;
            opacity: 0;
            text-align: center;
            margin-top: 30px;
            letter-spacing: 2px;
        }

        @keyframes taglineFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Sacred Symbols (Background) */
        .floating-symbol {
            position: absolute;
            font-size: 2rem;
            color: rgba(255, 215, 0, 0.2);
            animation: floatBackground 10s ease-in-out infinite;
            z-index: 10;
        }

        .sym1 { top: 10%; left: 10%; animation-delay: 0s; }
        .sym2 { top: 15%; right: 15%; animation-delay: 1s; }
        .sym3 { bottom: 15%; left: 15%; animation-delay: 2s; }
        .sym4 { bottom: 10%; right: 10%; animation-delay: 3s; }
        .sym5 { top: 30%; left: 30%; animation-delay: 4s; }
        .sym6 { top: 35%; right: 30%; animation-delay: 5s; }
        .sym7 { bottom: 30%; left: 30%; animation-delay: 6s; }
        .sym8 { bottom: 35%; right: 30%; animation-delay: 7s; }

        @keyframes floatBackground {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-30px) rotate(10deg); opacity: 0.4; }
        }

        /* Energy Particles */
        .energy-field {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .glow-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffd700, #ff69b4, transparent);
            border-radius: 50%;
            filter: blur(2px);
            animation: particleFloat 6s linear infinite;
        }

        @keyframes particleFloat {
            from {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }
            to {
                transform: translateY(-100vh) scale(2);
                opacity: 0;
            }
        }

        /* Loading Bar */
        .loading-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            text-align: center;
            z-index: 100;
        }

        .loading-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px #ffd700;
            backdrop-filter: blur(5px);
        }

        .loading-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ff69b4, #ff1493, #c71585, #ffd700);
            animation: load 8s ease-out forwards;
            border-radius: 6px;
        }

        @keyframes load {
            0% { width: 0%; }
            12.5% { width: 10%; }
            25% { width: 20%; }
            37.5% { width: 30%; }
            50% { width: 40%; }
            62.5% { width: 60%; }
            75% { width: 80%; }
            87.5% { width: 90%; }
            100% { width: 100%; }
        }

        .loading-text {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #ffd700;
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Fade Out Animation */
        @keyframes fadeOut {
            from { 
                opacity: 1;
                visibility: visible;
            }
            to { 
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Responsive */
        @media (max-width: 992px) {
            .custom-symbol {
                width: 160px;
                height: 160px;
            }
            
            .main-title {
                font-size: 3.2rem;
                letter-spacing: 4px;
            }
            
            .sub-title {
                font-size: 2rem;
                letter-spacing: 4px;
            }
            
            .sacred-text {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 768px) {
            .custom-symbol {
                width: 140px;
                height: 140px;
            }
            
            .main-title {
                font-size: 2.4rem;
                letter-spacing: 3px;
            }
            
            .sub-title {
                font-size: 1.6rem;
                letter-spacing: 3px;
            }
            
            .sub-title::before,
            .sub-title::after {
                font-size: 1.2rem;
                margin: 0 10px;
            }
            
            .tagline {
                font-size: 1.2rem;
            }
            
            .sacred-text {
                font-size: 1.5rem;
            }
            
            .loading-container {
                width: 350px;
            }
        }

        @media (max-width: 480px) {
            .custom-symbol {
                width: 120px;
                height: 120px;
            }
            
            .main-title {
                font-size: 1.8rem;
            }
            
            .sub-title {
                font-size: 1.2rem;
            }
            
            .loading-container {
                width: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-container" id="splashScreen">
        <!-- Sacred Background -->
        <div class="sacred-bg"></div>
        
        <!-- Floating Sacred Symbols (Background) -->
        <i class="fas fa-temple floating-symbol sym1"></i>
        <i class="fas fa-mountain floating-symbol sym2"></i>
        <i class="fas fa-water floating-symbol sym3"></i>
        <i class="fas fa-sun floating-symbol sym4"></i>
        <i class="fas fa-moon floating-symbol sym5"></i>
        <i class="fas fa-star floating-symbol sym6"></i>
        <i class="fas fa-landmark floating-symbol sym7"></i>
        <i class="fas fa-pagoda floating-symbol sym8"></i>

        <!-- Energy Particles -->
        <div class="energy-field" id="energyField"></div>

        <!-- Main Content -->
        <div class="content-container">
            <!-- Light Rays -->
            <div class="light-rays"></div>
            <div class="static-ray ray1"></div>
            <div class="static-ray ray2"></div>
            <div class="static-ray ray3"></div>
            <div class="static-ray ray4"></div>
            <div class="static-ray ray5"></div>
            <div class="static-ray ray6"></div>
            <div class="static-ray ray7"></div>
            <div class="static-ray ray8"></div>
            <div class="static-ray ray9"></div>
            <div class="static-ray ray10"></div>
            <div class="static-ray ray11"></div>
            <div class="static-ray ray12"></div>
            
            <!-- Sacred Circles -->
            <div class="sacred-circles">
                <div class="sacred-circle circle1"></div>
                <div class="sacred-circle circle2"></div>
                <div class="sacred-circle circle3"></div>
                <div class="sacred-circle circle4"></div>
                <div class="sacred-circle circle5"></div>
                <div class="sacred-circle circle6"></div>
            </div>
            
            <!-- ===== CUSTOM SYMBOL SECTION ===== -->
            <div class="symbol-section">
                <div class="sacred-text">सत्यं शिवं सुन्दरम्</div>
                
                <!-- Custom Symbol Combining Multiple Elements -->
                <div class="custom-symbol">
                    <!-- Eternal Circle -->
                    <div class="eternal-circle"></div>
                    
                    <!-- Inner Circle -->
                    <div class="inner-circle"></div>
                    
                    <!-- Center Dot -->
                    <div class="center-dot"></div>
                    
                    <!-- Sound Waves (Echoes) -->
                    <div class="wave wave1"></div>
                    <div class="wave wave2"></div>
                    <div class="wave wave3"></div>
                    
                    <!-- Infinity Symbol (Eternity) -->
                    <div class="infinity-symbol">∞</div>
                    
                    <!-- Mountain Peak (Sacred Places) -->
                    <div class="mountain-symbol">🏔️</div>
                    
                    <!-- Temple Symbol -->
                    <div class="temple-symbol">🏛️</div>
                </div>
            </div>

            <!-- ===== TITLE SECTION - One Line ===== -->
            <div class="title-section">
                <h1 class="main-title">ECHOES OF ETERNITY</h1>
            </div>

            <!-- ===== SUBTITLE - Next Line ===== -->
            <div class="sub-title">Sacred India Explorer</div>

            <!-- ===== TAGLINE ===== -->
            <div class="tagline">"Where ancient whispers meet modern souls"</div>
        </div>

        <!-- Loading Bar -->
        <div class="loading-container">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-text" id="loadingText">✨ The eternal echoes awaken...</div>
        </div>
    </div>

    <!-- Main Content Frame -->
    <iframe id="mainFrame" src="main.html" style="width: 100%; height: 100vh; border: none; display: none;"></iframe>

    <script>
        // Create energy particles
        function createEnergyParticles() {
            const energyField = document.getElementById('energyField');
            const particleCount = 70;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'glow-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 3) + 's';
                particle.style.background = `radial-gradient(circle, ${Math.random() > 0.5 ? '#ffd700' : '#ff69b4'}, transparent)`;
                particle.style.width = Math.random() * 14 + 4 + 'px';
                particle.style.height = particle.style.width;
                energyField.appendChild(particle);
            }
        }

        // Dynamic loading messages
        const loadingMessages = [
            '✨ The eternal echoes awaken...',
            '🏔️ Sacred mountains rise...',
            '🏛️ Ancient temples glow...',
            '🌊 Divine vibrations flow...',
            '🌟 ECHOES OF ETERNITY unfolds...',
            '🕉️ The sacred presence settles...',
            '🌸 Your spiritual journey awaits...'
        ];

        // Transition to main page
        function transitionToMain() {
            const splashScreen = document.getElementById('splashScreen');
            const mainFrame = document.getElementById('mainFrame');
            const loadingText = document.getElementById('loadingText');
            
            // Change loading messages every 1.2 seconds
            let index = 0;
            const textInterval = setInterval(() => {
                if (index < loadingMessages.length - 1) {
                    index++;
                    loadingText.style.opacity = '0';
                    setTimeout(() => {
                        loadingText.textContent = loadingMessages[index];
                        loadingText.style.opacity = '1';
                    }, 200);
                } else {
                    clearInterval(textInterval);
                }
            }, 1150);
            
            // Transition after 9 seconds
            setTimeout(() => {
                splashScreen.style.animation = 'fadeOut 1s ease forwards';
                
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    mainFrame.style.display = 'block';
                    document.body.style.overflow = 'auto';
                    mainFrame.style.animation = 'zoomIn 1s ease';
                }, 1000);
            }, 9000);
        }

        // Initialize
        window.onload = function() {
            createEnergyParticles();
            transitionToMain();
        };

        // Fallback
        window.onerror = function() {
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 10000);
        };
    </script>
</body>
</html>
